<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estilo A — Electric Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
    :root{
        --bg-dark:#0a0a0a;
        --bg-white:#ffffff;
        --accent-blue:#4361ee;
        --text-dark:#0a0a0a;
        --text-light:#ffffff;
        --font-display:'Manrope',sans-serif;
        --font-body:'Manrope',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}

    /* === FIXED 16:9 STAGE (mandatory) === */
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;}
    .deck-viewport{position:fixed;inset:0;overflow:hidden;background:#000;}
    .deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#fff;}
    .slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:#fff;}
    .slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important;}}

    /* === REVEAL === */
    .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);}
    .slide.visible .reveal{opacity:1;transform:translateY(0);}
    .reveal:nth-child(1){transition-delay:.1s;}
    .reveal:nth-child(2){transition-delay:.25s;}
    .reveal:nth-child(3){transition-delay:.4s;}

    /* === ELECTRIC STUDIO: split panel, white top / navy-blue bottom === */
    .title-slide{display:flex;flex-direction:column;font-family:var(--font-body);}
    .panel-top{
        flex:0 0 58%;
        background:var(--bg-white);
        position:relative;
        display:flex;
        flex-direction:column;
        justify-content:flex-end;
        padding:80px 140px 60px;
    }
    .panel-top::after{
        content:"";
        position:absolute;left:140px;right:140px;bottom:0;
        height:6px;background:var(--accent-blue);
    }
    .corner-mark{
        position:absolute;top:64px;left:140px;
        font-size:20px;font-weight:700;letter-spacing:.14em;
        color:var(--text-dark);text-transform:uppercase;
    }
    .corner-mark.right{left:auto;right:140px;color:#9aa0a6;font-weight:500;letter-spacing:.08em;}
    .kicker{
        font-size:24px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
        color:var(--accent-blue);margin-bottom:28px;
    }
    h1{
        font-family:var(--font-display);font-weight:800;font-size:92px;line-height:1.06;
        color:var(--text-dark);letter-spacing:-.015em;max-width:1250px;
    }
    .panel-bottom{
        flex:1;background:var(--bg-dark);display:flex;align-items:center;
        padding:0 140px;
    }
    .quote{
        font-family:var(--font-body);font-weight:500;font-size:34px;line-height:1.5;
        color:var(--text-light);max-width:1180px;
    }
    .quote b{color:var(--accent-blue);font-weight:800;}
</style>
</head>
<body>
<div class="deck-viewport">
    <main class="deck-stage" id="deckStage">
        <section class="slide active visible title-slide">
            <div class="panel-top">
                <span class="corner-mark">Informe para directorio</span>
                <span class="corner-mark right">Septiembre 2026</span>
                <span class="kicker reveal">Paquete Premium</span>
                <h1 class="reveal">Cuatro perfiles de clientes que abandonan el Paquete Premium</h1>
            </div>
            <div class="panel-bottom">
                <p class="quote reveal">Segmentación basada en comportamiento observado — bajas estrictas con historia completa (<b>n = 1.991</b>)</p>
            </div>
        </section>
    </main>
</div>
<script>
(function(){
    const stage=document.getElementById('deckStage');
    function scale(){
        const f=Math.min(window.innerWidth/1920,window.innerHeight/1080);
        const x=(window.innerWidth-1920*f)/2, y=(window.innerHeight-1080*f)/2;
        stage.style.transform=`translate(${x}px,${y}px) scale(${f})`;
    }
    scale();window.addEventListener('resize',scale);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estilo B — Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=DM+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root{
        --navy:#1C2644; --navy-alt:#232F55;
        --cream:#F0ECE3; --cream-alt:#E6E0D4;
        --text-warm:#E2DCD0; --text-muted-dark:#8A96A8; --text-hint-dark:#4E5A6E;
        --gold:#C8A870;
        --font-serif:'Source Serif 4',serif;
        --font-sans:'DM Sans',sans-serif;
        --font-mono:'IBM Plex Mono',monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box;}

    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;}
    .deck-viewport{position:fixed;inset:0;overflow:hidden;background:#000;}
    .deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--navy);}
    .slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--navy);}
    .slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important;}}

    .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);}
    .slide.visible .reveal{opacity:1;transform:translateY(0);}
    .reveal:nth-child(1){transition-delay:.1s;}
    .reveal:nth-child(2){transition-delay:.3s;}
    .reveal:nth-child(3){transition-delay:.5s;}
    .reveal:nth-child(4){transition-delay:.65s;}

    /* === SIGNAL: editorial navy/cream, near-invisible 80px grid, gold accent === */
    .title-slide{
        position:relative;
        background:
            repeating-linear-gradient(0deg,rgba(226,220,208,.045) 0 1px,transparent 1px 80px),
            repeating-linear-gradient(90deg,rgba(226,220,208,.045) 0 1px,transparent 1px 80px),
            var(--navy);
        display:flex;flex-direction:column;justify-content:space-between;
        padding:88px 140px;
    }
    .masthead{
        display:flex;justify-content:space-between;align-items:center;
        font-family:var(--font-mono);font-size:19px;letter-spacing:.08em;
        color:var(--text-muted-dark);text-transform:uppercase;
        border-bottom:1px solid rgba(138,150,168,.35);
        padding-bottom:28px;
    }
    .masthead .mark{color:var(--gold);}
    .hero{max-width:1360px;}
    h1{
        font-family:var(--font-serif);font-weight:400;font-size:98px;line-height:1.14;
        color:var(--cream);letter-spacing:-.01em;
    }
    h1 em{font-style:italic;color:var(--gold);font-weight:500;}
    .sub{
        margin-top:40px;font-family:var(--font-sans);font-weight:400;font-size:30px;line-height:1.6;
        color:var(--text-warm);max-width:1100px;border-left:2px solid var(--gold);padding-left:28px;
    }
    .sub b{color:var(--gold);font-weight:500;}
    .footline{
        display:flex;justify-content:space-between;align-items:flex-end;
        font-family:var(--font-mono);font-size:17px;letter-spacing:.06em;color:var(--text-hint-dark);
        border-top:1px solid rgba(138,150,168,.25);padding-top:24px;text-transform:uppercase;
    }
</style>
</head>
<body>
<div class="deck-viewport">
    <main class="deck-stage" id="deckStage">
        <section class="slide active visible title-slide">
            <div class="masthead reveal">
                <span>Informe <span class="mark">·</span> Directorio</span>
                <span>Paquete Premium</span>
            </div>
            <div class="hero">
                <h1 class="reveal">Cuatro perfiles de clientes que <em>abandonan</em> el Paquete Premium</h1>
                <p class="sub reveal">Segmentación basada en comportamiento observado — bajas estrictas con historia completa (<b>n = 1.991</b>)</p>
            </div>
            <div class="footline reveal">
                <span>Septiembre 2026</span>
                <span>Uso interno</span>
            </div>
        </section>
    </main>
</div>
<script>
(function(){
    const stage=document.getElementById('deckStage');
    function scale(){
        const f=Math.min(window.innerWidth/1920,window.innerHeight/1080);
        const x=(window.innerWidth-1920*f)/2, y=(window.innerHeight-1080*f)/2;
        stage.style.transform=`translate(${x}px,${y}px) scale(${f})`;
    }
    scale();window.addEventListener('resize',scale);
})();
</script>
</body>
</html>

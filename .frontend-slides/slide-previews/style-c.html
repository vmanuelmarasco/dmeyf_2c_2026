<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estilo C — Panel de riesgo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root{
        --bg:#10131C;
        --bg-grid:rgba(255,255,255,.035);
        --paper:#F4F1EA;
        --muted:#7D8599;
        --c1:#2F6B9A; /* transaccionales */
        --c2:#2A9D8F; /* nomina */
        --c3:#8C6BB1; /* credito */
        --c4:#D97732; /* desvinculacion */
        --font-display:'Fraunces',serif;
        --font-mono:'Space Mono',monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box;}

    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;}
    .deck-viewport{position:fixed;inset:0;overflow:hidden;background:#000;}
    .deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--bg);}
    .slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--bg);}
    .slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important;}}

    .reveal{opacity:0;transform:translateY(22px);transition:opacity .75s cubic-bezier(.16,1,.3,1),transform .75s cubic-bezier(.16,1,.3,1);}
    .slide.visible .reveal{opacity:1;transform:translateY(0);}
    .reveal:nth-child(1){transition-delay:.05s;}
    .reveal:nth-child(2){transition-delay:.2s;}
    .reveal:nth-child(3){transition-delay:.4s;}
    .reveal:nth-child(4){transition-delay:.55s;}

    /* === PANEL DE RIESGO: dot-grid de control de riesgo + 4 marcadores de segmento === */
    .title-slide{
        position:relative; display:flex; flex-direction:column; justify-content:center;
        padding:0 150px;
        background-image: radial-gradient(var(--bg-grid) 1.6px, transparent 1.6px);
        background-size: 36px 36px;
    }
    .glow{
        position:absolute; width:900px; height:900px; border-radius:50%;
        right:-280px; top:-320px;
        background:radial-gradient(circle, rgba(217,119,50,.14), transparent 65%);
        pointer-events:none;
    }
    .segment-markers{
        display:flex; gap:14px; align-items:center; margin-bottom:34px;
    }
    .seg{width:14px;height:14px;border-radius:3px;}
    .seg.s1{background:var(--c1);} .seg.s2{background:var(--c2);}
    .seg.s3{background:var(--c3);} .seg.s4{background:var(--c4);}
    .seg-label{
        font-family:var(--font-mono);font-size:17px;letter-spacing:.1em;color:var(--muted);
        text-transform:uppercase;margin-left:6px;
    }
    .kicker{
        font-family:var(--font-mono);font-size:19px;letter-spacing:.16em;text-transform:uppercase;
        color:var(--c4);margin-bottom:26px;
    }
    h1{
        font-family:var(--font-display);font-weight:700;font-size:104px;line-height:1.05;
        color:var(--paper);letter-spacing:-.01em;max-width:1420px;
    }
    .sub{
        margin-top:36px;font-family:var(--font-mono);font-size:22px;line-height:1.7;
        color:var(--muted);max-width:1150px;
    }
    .sub .n{color:var(--paper);font-weight:700;}
    .baseline{
        position:absolute; bottom:72px; left:150px; right:150px;
        display:flex; justify-content:space-between;
        font-family:var(--font-mono); font-size:16px; letter-spacing:.08em; color:var(--muted);
        text-transform:uppercase; border-top:1px solid rgba(255,255,255,.12); padding-top:22px;
    }
</style>
</head>
<body>
<div class="deck-viewport">
    <main class="deck-stage" id="deckStage">
        <section class="slide active visible title-slide">
            <div class="glow"></div>
            <div class="segment-markers reveal">
                <span class="seg s1"></span><span class="seg s2"></span><span class="seg s3"></span><span class="seg s4"></span>
                <span class="seg-label">Cuatro perfiles de salida</span>
            </div>
            <span class="kicker reveal">Informe para directorio</span>
            <h1 class="reveal">Clientes que abandonan el Paquete Premium</h1>
            <p class="sub reveal">Segmentación basada en comportamiento observado — bajas estrictas con historia completa (<span class="n">n = 1.991</span>)</p>
            <div class="baseline reveal">
                <span>Septiembre 2026</span>
                <span>Uso interno</span>
            </div>
        </section>
    </main>
</div>
<script>
(function(){
    const stage=document.getElementById('deckStage');
    function scale(){
        const f=Math.min(window.innerWidth/1920,window.innerHeight/1080);
        const x=(window.innerWidth-1920*f)/2, y=(window.innerHeight-1080*f)/2;
        stage.style.transform=`translate(${x}px,${y}px) scale(${f})`;
    }
    scale();window.addEventListener('resize',scale);
})();
</script>
</body>
</html>
